<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">RepoPact Workbench social preview</title>
  <desc id="desc">A genuine Workbench work-item screen is framed by a quiet dark-blue and teal presentation, with the words RepoPact Workbench and Review repository work with evidence.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0c1726"/><stop offset="1" stop-color="#1b344a"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000" flood-opacity=".32"/></filter>
    <clipPath id="screen"><rect x="546" y="132" width="662" height="376" rx="12"/></clipPath>
    <style>
      .sans{font-family:Inter,"Segoe UI",Arial,sans-serif}
      .eyebrow{font:700 14px Inter,"Segoe UI",Arial,sans-serif;letter-spacing:2px;fill:#90d8c7}
      .title{font:700 43px Inter,"Segoe UI",Arial,sans-serif;letter-spacing:-.8px;fill:#f4f7fa}
      .sub{font:400 20px Inter,"Segoe UI",Arial,sans-serif;fill:#c0ccd7}
      .small{font:600 14px Inter,"Segoe UI",Arial,sans-serif;letter-spacing:.6px;fill:#dbe5ed}
    </style>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <path d="M0 548H1280" stroke="#3a5266" stroke-width="1"/>
  <text x="72" y="80" class="eyebrow">REPOPACT · NATIVE REPOSITORY WORKBENCH</text>
  <text x="72" y="160" class="title">RepoPact</text>
  <text x="72" y="210" class="title">Workbench</text>
  <rect x="72" y="244" width="64" height="4" rx="2" fill="#60bfa9"/>
  <text x="72" y="294" class="sub">Review repository work</text>
  <text x="72" y="324" class="sub">with evidence.</text>
  <text x="72" y="465" class="small">NATIVE INTERFACE · CORE-POWERED</text>
  <g filter="url(#shadow)">
    <rect x="530" y="116" width="694" height="408" rx="18" fill="#f4f7fa" stroke="#8fc8ba" stroke-width="2"/>
    <!-- Authentic screenshot source, cropped only to remove window chrome and blank cursor margin. -->
    <image href="workbench-social-screenshot.jpg" x="546" y="132" width="662" height="376" preserveAspectRatio="xMidYMid meet" clip-path="url(#screen)"/>
  </g>
  <rect x="72" y="580" width="1136" height="1" fill="#3a5266"/>
  <text x="72" y="612" class="eyebrow">RECORDS REMAIN AUTHORITATIVE · HUMAN REVIEW STAYS VISIBLE</text>
</svg>



